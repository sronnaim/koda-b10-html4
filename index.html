<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Semantics HTML Illustrated</title>
    <meta name="description" content="Layouting with clear HTML semantics illustrated">
</head>
<body>
    <main>
        <article>
            <h1>HTML Semantics Layouting Illustration</h1>
            <table border="1" width="350">
                <thead>
                    <tr>
                        <td scope="col" colspan="8" height="60" align="center"><font color="green">&lt;header&gt;</font></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" height="60" align="center"><font color="blue">&lt;nav&gt;</font></th>
                    </tr>
                    <tr>
                        <td colspan="6" height="60" align="center"><font color="purple">&lt;section&gt;</font></th>
                        <td rowspan="2" colspan="2" align="center"><font color="khaki">&lt;aside&gt;</font></td>
                    </tr>
                    <tr>
                        <td colspan="6" height="60" align="center"><font color="turquoise">&lt;article&gt;</font></th>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td scope="col" colspan="8" height="60" align="center"><font color="red">&lt;footer&gt;</font></th>
                    </tr>
                </tfoot>
            </table>
        </article>
    </main>
</body>
</html>
